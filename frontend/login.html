<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ERP Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* padding: 10px; */
    }

    /* Container: Desktop pe same, Mobile pe bg-transparent taaki panels alag dikhein */
    .container-custom {
      display: flex;
      width: 100%;
      max-width: 1150px;
      min-height: 580px;
      position: relative;
      flex-direction: row; /* Desktop default */
    }

    /* LEFT PANEL */
    .left-panel {
      flex: 1.5;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding-top: 30px;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .logo-svg {
      width: 100px;
      height: 100px;
    }

    .school-name {
      font-size: 26px;
      font-weight: 800;
      color: #1a5fa8;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 16px;
      padding: 0 20px;
    }

    .wave-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 360px;
    }

    .wave-bg {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
    }

    .need-help-btn {
      background: transparent;
      border: 2px solid white;
      color: white;
      padding: 10px 32px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .contact-info {
      text-align: center;
      color: white;
    }

    .contact-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 6px 0;
      font-size: 13.5px;
    }

    .copyright {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.85);
      font-size: 11px;
      z-index: 3;
    }

    /* RIGHT PANEL */
    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      z-index: 20;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      position: relative;
    }

    /* Desktop only overlap - NO CHANGE */
    @media (min-width: 1024px) {
      .login-card {
        margin-left: -160px; 
      }
      .container-custom {
        /* border-radius: 16px; */
        overflow: hidden;
      }
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #374151;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .corner-deco {
      position: absolute;
      top: 0;
      right: 0;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #1a7ec8, #1273b0);
      border-radius: 0 0 0 60px;
      z-index: 1;
    }

    /* MOBILE VIEW: Separating the containers */
    @media (max-width: 1023px) {
      body {
        display: block; /* Allow scrolling */
        /* padding: 20px 10px; */
      }
      .container-custom {
        flex-direction: column;
        min-height: auto;
        gap: 20px; /* Gap between both containers */
      }
      .left-panel {
        padding-bottom: 250px; 
        border-radius: 20px; /* Mobile pe standalone look */
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      .wave-container {
        height: 280px;
      }
      .right-panel {
        padding: 0;
        margin-top: 0; /* No overlap on mobile */
      }
      .login-card {
        margin-left: 0;
        /* box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); */
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>

<div class="container-custom ">
  <div class="left-panel lg:rounded-2xl rounded-none shadow-lg ">
    <div class="corner-deco"></div>

    <div class="logo-area  ">
      <img src="/public/logo.png" alt="Logo" class="logo-svg">
      <div class="school-name">School Management System</div>
      <div class="text-[13px] text-gray-500">Learn Today for a Better Tomorrow</div>
    </div>

    <div class="wave-container">
      <svg class="wave-bg" viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0,80 C80,20 200,100 300,60 C400,20 480,80 560,50 L560,350 L0,350 Z" fill="#1a8fd1"/>
        <path d="M0,95 C100,40 200,110 310,75 C420,40 490,90 560,65 L560,350 L0,350 Z" fill="#1273b0"/>
        <circle cx="20" cy="230" r="120" fill="rgba(255,255,255,0.05)"/>
        <circle cx="20" cy="230" r="80" fill="#1273b0"/>
        <circle cx="520" cy="150" r="80" fill="rgba(255,255,255,0.05)"/>
        <circle cx="520" cy="150" r="55" fill="#1273b0"/>
      </svg>

      <div style="position:absolute; top:80px; left:0; right:0; bottom:30px; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2;">
        <button class="need-help-btn">Need Help?</button>
        <div class="contact-info">
          <div class="contact-row"><span>School Chairman :- Mukesh Yadav</span></div>
          <div class="contact-row"><span class="icon">☎</span><span>+91 92140 14070</span></div>
        </div>
      </div>
      <div class="copyright">Copyright &copy; 2026-27 School ERP</div>
    </div>
  </div>

  <div class="right-panel lg:rounded-2xl rounded-none">
    <div class="login-card lg:rounded-2xl rounded-none  lg:shadow-lg lg:bg-white lg:relative">
      <div class="lg:flex hidden lg:absolute -top-9 left-1/2 -translate-x-1/2 w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#00b4d8" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div class="form-group">
          <label>User Id</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">👤</span>
            <input type="text" id="username" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-md bg-[#f2f7fb] text-sm focus:outline-none focus:ring-1 focus:ring-[#0076b6]" placeholder="Admin1" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">🔒</span>
            <input type="password" id="password" class="w-full pl-10 pr-10 py-2.5 border border-gray-200 rounded-md bg-[#f2f7fb] text-sm focus:outline-none focus:ring-1 focus:ring-[#0076b6]" placeholder="********" required>
            <span class="eye-icon absolute right-3.5 top-1/2 -translate-y-1/2 cursor-pointer text-gray-400 text-xs">👁️</span>
          </div>
        </div>

        <button id="loginBtn" type="submit" class="w-full py-3.5 bg-[#0076b6] text-white font-bold rounded-md hover:bg-[#005a8b] transition-all shadow-lg active:scale-[0.98]">
          LOGIN
        </button>

        <div id="loginMessage" class="hidden rounded-lg px-3 py-2 text-sm font-medium"></div>

        <div class="mt-4 rounded-xl border border-blue-100 bg-blue-50 p-3 text-xs text-[#0f4c81] space-y-1">
          <p><strong>Admin / Teacher / Staff Login:</strong> Please log in from this page.</p>
          <p><strong>Parent Login:</strong> Please log in through the Parent Portal.</p>
          <a href="/parent-login" class="inline-flex mt-1 text-[#0076b6] font-semibold hover:underline">Open Parent Portal →</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.querySelector('.eye-icon').addEventListener('click', function() {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  function showLoginMessage(message, type = 'error') {
    const box = document.getElementById('loginMessage');
    box.textContent = message;
    box.className = `rounded-lg px-3 py-2 text-sm font-medium ${type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' : 'bg-red-50 text-red-700 border border-red-100'}`;
  }

  async function handleLogin(event) {
    event.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    if (!username || !password) {
      showLoginMessage('User ID and password are required.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'LOGGING IN...';

    try {
      const response = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const result = await response.json();

      if (!response.ok || !result?.success) {
        let message = result?.detail || result?.message || 'Invalid username or password';
        if (Array.isArray(message)) {
          message = message.map(item => item?.msg || JSON.stringify(item)).join(', ');
        }
        showLoginMessage(message);
        return;
      }

      const data = result.data || {};
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user || {}));
      if (data.user?.assigned_school_id) {
        localStorage.setItem('school_id', data.user.assigned_school_id);
      }

      showLoginMessage('Login successful. Opening dashboard...', 'success');
      window.location.href = '/dashboard';
    } catch (error) {
      showLoginMessage('Unable to connect to the server. Please check whether the backend is running.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'LOGIN';
    }
  }
</script>

</body>
</html>
