<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/public/circlelogo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #f0f2f8;
      color: #1e293b
    }

    h1,
    h2,
    h3,
    h4,
    .font-outfit {
      font-family: "Outfit", sans-serif
    }

    .finput {
      width: 100%;
      padding: .625rem .875rem;
      border-radius: .75rem;
      border: 1.5px solid #e2e8f0;
      background: #f0f2f8;
      font-size: .875rem;
      outline: none;
      transition: all .15s;
      color: #1e293b
    }

    .finput:focus {
      background: #fff;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, .12)
    }

    .lbl {
      display: block;
      font-size: .8125rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: .375rem
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(15, 23, 42, .55);
      backdrop-filter: blur(4px)
    }

    .modal-box {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, .22);
      width: 100%;
      overflow: hidden;
      animation: modalIn .2s ease
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(.96) translateY(6px)
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0)
      }
    }

    .tab-bar {
      display: flex;
      border-bottom: 2px solid #f1f5f9;
      overflow-x: auto;
      gap: .25rem;
      padding: 0 1rem
    }

    .tab-bar::-webkit-scrollbar {
      display: none
    }

    .tab-btn {
      padding: .875rem 1.125rem;
      font-size: .8125rem;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      color: #94a3b8;
      border-bottom: 2.5px solid transparent;
      margin-bottom: -2px;
      transition: all .15s;
      font-family: "DM Sans", sans-serif
    }

    .tab-btn.active {
      color: #6366f1;
      border-bottom-color: #6366f1
    }

    .tab-btn:not(.active):hover {
      color: #475569
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px
    }
  </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Examinations - Scholar Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .finput {
      width: 100%;
      padding: .625rem .75rem;
      border-radius: .75rem;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      font-size: .875rem;
      outline: none
    }

    .finput:focus {
      background: #fff;
      border-color: #3b82f6
    }

    .lbl {
      display: block;
      font-size: .875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: .375rem
    }
  </style>
</head>

<body>
    <div class="min-h-screen">
    <div id="sidebarContainer"></div>
    <main class="min-h-screen lg:ml-[260px]">
      <div id="topbarContainer"></div>
      <div class="p-6 space-y-6">

        <div
          style="background:#fff;border-radius:1.25rem;border:1.5px solid #f1f5f9;box-shadow:0 1px 3px rgba(0,0,0,.04)">
          <div class="flex border-b border-gray-100 px-2 gap-1">
            <button onclick="switchExTab(0)"
              class="extab px-5 py-4 text-sm font-semibold border-b-2 border-blue-600 text-blue-600">Exams</button>
            <button onclick="switchExTab(1)"
              class="extab px-5 py-4 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700">Exam Roll No</button>
            <button onclick="switchExTab(2)"
              class="extab px-5 py-4 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700">Date Sheet</button>
            <button onclick="switchExTab(3)"
              class="extab px-5 py-4 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700">Enter
              Marks</button>
            <button onclick="switchExTab(4)"
              class="extab px-5 py-4 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700">Results</button>
          </div>

          <!-- Exams -->
          <div id="extab0" class="p-5">
            <div class="flex justify-between mb-4">
              <div class="flex gap-2">
                <select id="examTypeFilter"
                  class="px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:outline-none">
                  <option value="">All Types</option>
                  <option value="Test">Test</option>
                  <option value="Exam">Exam</option>
                </select>
              </div>
              <div class="flex gap-2">
                <button onclick="openExamModal()"
                  class="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold text-sm hover:bg-blue-700 shadow-lg">+
                  Create Exam</button>
              </div>
            </div>
            <div id="examTable"></div>
          </div>

          <!-- Exam Roll Numbers -->
          <div id="extab1" class="p-5 hidden">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-5">
              <div><label class="lbl">Class *</label><select id="rn_cls" class="finput" onchange="loadRollSections()"><option value="">Select class</option></select></div>
              <div><label class="lbl">Section</label><select id="rn_sec" class="finput"><option value="">All sections</option></select></div>
              <div><label class="lbl">Set Exam Roll No As</label><select id="rn_mode" class="finput" onchange="toggleRollSeries()"><option value="manual">Manual</option><option value="roll_no">Roll No</option><option value="admission_no">Admission No</option><option value="series">Series</option></select></div>
              <div id="rnSeriesWrap" style="display:none"><label class="lbl">Series Start</label><input id="rn_start" type="number" class="finput" value="1" /></div>
            </div>
            <div class="flex gap-3 mb-4">
              <button onclick="loadRollStudents()" class="px-4 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold">Load Students</button>
              <button onclick="saveRollNumbers()" class="px-4 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-semibold">Save Roll Numbers</button>
            </div>
            <div id="rollTable"></div>
          </div>

          <!-- Date Sheet -->
          <div id="extab2" class="p-5 hidden">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-5">
              <div><label class="lbl">Exam Type</label><select id="ds_type" class="finput" onchange="loadDateSheetExams()"><option value="">All</option><option value="Test">Test</option><option value="Exam">Exam</option></select></div>
              <div><label class="lbl">Exam *</label><select id="ds_exam" class="finput"><option value="">Select exam</option></select></div>
              <div><label class="lbl">Class *</label><select id="ds_cls" class="finput" onchange="loadDateSheetSections()"><option value="">Select class</option></select></div>
              <div><label class="lbl">Section</label><select id="ds_sec" class="finput"><option value="">All sections</option></select></div>
            </div>
            <div class="flex gap-3 mb-4">
              <button onclick="loadDateSheet()" class="px-4 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold">Load Subjects</button>
              <button onclick="saveDateSheet()" class="px-4 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-semibold">Save & Notify</button>
              <button onclick="printDateSheet()" class="px-4 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-sm font-semibold">Print</button>
            </div>
            <div id="dateSheetTable"></div>
            <div id="dateSheetSavedPreview" class="mt-6"></div>
          </div>

          <!-- Enter Marks -->
          <div id="extab3" class="p-5 hidden">
            <h4 class="font-bold text-gray-900 mb-4">Enter Marks</h4>
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-5">
              <div><label class="lbl">Exam *</label><select id="mk_exam" class="finput">
                  <option value="">Select exam</option>
                </select></div>
              <div><label class="lbl">Class *</label><select id="mk_cls" class="finput" onchange="loadMarksSections();loadMarksSubjects()">
                  <option value="">Select class</option>
                </select></div>
              <div><label class="lbl">Section *</label><select id="mk_sec" class="finput" onchange="loadMarksSubjects()">
                  <option value="">Select section</option>
                </select></div>
              <div id="mkSubWrap"><label class="lbl">Subject *</label><select id="mk_sub" class="finput">
                  <option value="">Select subject</option>
                </select></div>
              <div><label class="lbl">Entry Mode</label><select id="mk_mode" class="finput" onchange="toggleMarksMode()"><option value="single">Single Subject</option><option value="all">All Subjects At Once</option></select></div>
            </div>
            <button onclick="loadStudentsForMarks()"
              class="mb-4 px-4 py-2.5 bg-blue-600 text-white rounded-xl font-medium text-sm hover:bg-blue-700">Load
              Students</button>
            <div id="marksTable"></div>
            <div id="marksActionRow" class="hidden mt-4">
              <button onclick="saveMarks()"
                class="px-6 py-2.5 bg-emerald-600 text-white rounded-xl font-semibold text-sm hover:bg-emerald-700 shadow-lg">Save
                Marks</button>
            </div>
          </div>

          <!-- Results -->
          <div id="extab4" class="p-5 hidden">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-4">
              <div><label class="lbl">Exam *</label><select id="res_exam" class="finput">
                  <option value="">Select exam</option>
                </select></div>
              <div><label class="lbl">Class *</label><select id="res_cls" class="finput"
                  onchange="loadResultSections()">
                  <option value="">Select class</option>
                </select></div>
              <div><label class="lbl">Section *</label><select id="res_sec" class="finput">
                  <option value="">Select section</option>
                </select></div>
              <div class="flex items-end gap-2">
                <button onclick="loadResults()"
                  class="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-medium hover:bg-blue-700">View</button>
                <button onclick="generateResults()"
                  class="px-4 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-medium hover:bg-emerald-700">Generate</button>
              </div>
            </div>
            <div class="flex justify-end mb-4">
              <button onclick="printResultsSummary()" class="px-4 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-sm font-medium hover:bg-slate-200">Print Result List</button>
            </div>
            <div id="resultsTable"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Exam Modal -->
  <div id="examModal" class="modal-overlay" style="display:none">
    <div class="modal-box w-full max-w-md">
      <div class="flex justify-between items-center px-6 py-4 border-b">
        <h3 id="examModalTitle" class="font-bold text-gray-900">Create Exam</h3><button
          onclick="document.getElementById('examModal').style.display='none'"
          class="p-2 text-gray-400 hover:text-gray-600 rounded-xl text-lg">×</button>
      </div>
      <div class="px-6 py-5 space-y-4">
        <div><label class="lbl">Exam Name *</label><input id="ex_name" class="finput"
            placeholder="e.g. Unit Test 1, Mid Term 2024" /></div>
        <div><label class="lbl">Exam Type *</label>
          <select id="ex_type" class="finput">
            <option value="">Select type</option>
            <option value="Test">Test</option>
            <option value="Exam">Exam</option>
          </select>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div><label class="lbl">Max Marks</label><input id="ex_max" type="number" class="finput" value="100" /></div>
          <div><label class="lbl">Min Marks</label><input id="ex_pass" type="number" class="finput" value="33" /></div>
          <div><label class="lbl">Order</label><input id="ex_order" type="number" class="finput" value="0" /></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="lbl">Start Date</label><input id="ex_start" type="date" class="finput" /></div>
          <div><label class="lbl">End Date</label><input id="ex_end" type="date" class="finput" /></div>
        </div>
        <div><label class="lbl">Classes</label>
          <div id="exClassCheckboxes" class="space-y-2 max-h-40 overflow-y-auto border border-gray-200 rounded-xl p-3">
          </div>
        </div>
      </div>
      <div class="flex gap-3 px-6 py-4 border-t justify-end">
        <button onclick="document.getElementById('examModal').style.display='none'"
          class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-xl text-sm">Cancel</button>
        <button id="examSubmitBtn" onclick="saveExam()"
          class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-medium">Create</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-6 right-6 z-50 px-6 py-3 rounded-xl text-white font-medium shadow-2xl">
  </div>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    requireAuth();
    document.getElementById('sidebarContainer').innerHTML = renderSidebar('exams');
    document.getElementById('topbarContainer').innerHTML = renderTopbar('Examinations', 'Manage exams, marks and results');
    const schoolId = localStorage.getItem('school_id'), ayId = localStorage.getItem('ay_id');
    let marksStudents = [];
    let marksMatrixSubjects = [];
    let latestResults = [];
    let rollStudents = [];
    let dateSheetRows = [];
    let examClasses = [];
    let examList = [];
    let editingExamId = '';

    function switchExTab(idx) {
      document.querySelectorAll('.extab').forEach((b, i) => { b.classList.toggle('border-blue-600', i === idx); b.classList.toggle('text-blue-600', i === idx); b.classList.toggle('border-transparent', i !== idx); b.classList.toggle('text-gray-500', i !== idx); });
      document.querySelectorAll('[id^="extab"]').forEach(t => { t.classList.toggle('hidden', parseInt(t.id.replace('extab', '')) !== idx); });
      if (idx === 0) loadExams();
      if (idx === 1) loadRollFormData();
      if (idx === 2) loadDateSheetFormData();
      if (idx === 3) loadMarksFormData();
      if (idx === 4) loadResultFormData();
    }

    async function loadExamClasses() {
      if (!schoolId) return;
      try { const r = await ClassAPI.list(schoolId, ayId); examClasses = r?.data || []; document.getElementById('exClassCheckboxes').innerHTML = examClasses.map(c => `<label class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 rounded-lg p-1"><input type="checkbox" value="${c.id}" class="exam-cls w-4 h-4 accent-blue-600"/><span class="text-sm text-gray-700">${c.name}</span></label>`).join(''); } catch (e) { }
    }

    function resetExamModal() {
      editingExamId = '';
      document.getElementById('examModalTitle').textContent = 'Create Exam';
      document.getElementById('examSubmitBtn').textContent = 'Create';
      document.getElementById('ex_name').value = '';
      document.getElementById('ex_type').value = '';
      document.getElementById('ex_max').value = '100';
      document.getElementById('ex_pass').value = '33';
      document.getElementById('ex_order').value = '0';
      document.getElementById('ex_start').value = '';
      document.getElementById('ex_end').value = '';
      document.querySelectorAll('.exam-cls').forEach(cb => cb.checked = false);
    }

    async function openExamModal(examId = '') {
      document.getElementById('examModal').style.display = 'flex';
      await loadExamClasses();
      resetExamModal();
      if (!examId) return;
      const exam = examList.find(item => item.id === examId);
      if (!exam) { showToast('Exam not found', 'error'); return; }
      editingExamId = examId;
      document.getElementById('examModalTitle').textContent = 'Edit Exam';
      document.getElementById('examSubmitBtn').textContent = 'Update';
      document.getElementById('ex_name').value = exam.name || '';
      document.getElementById('ex_type').value = exam.exam_type || '';
      document.getElementById('ex_max').value = exam.max_marks || 100;
      document.getElementById('ex_pass').value = exam.passing_marks || 33;
      document.getElementById('ex_order').value = exam.display_order || 0;
      document.getElementById('ex_start').value = exam.start_date ? String(exam.start_date).slice(0, 10) : '';
      document.getElementById('ex_end').value = exam.end_date ? String(exam.end_date).slice(0, 10) : '';
      const selectedClassIds = new Set(exam.classroom_ids || []);
      document.querySelectorAll('.exam-cls').forEach(cb => cb.checked = selectedClassIds.has(cb.value));
    }

    async function saveExam() {
      if (!schoolId || !ayId) { showToast('Configure school and academic year', 'error'); return; }
      const name = document.getElementById('ex_name').value.trim(), type = document.getElementById('ex_type').value;
      if (!name || !type) { showToast('Name and type required', 'error'); return; }
      const clsIds = Array.from(document.querySelectorAll('.exam-cls:checked')).map(c => c.value);
      try {
        const payload = { school_id: schoolId, academic_year_id: ayId, name, exam_type: type, max_marks: parseFloat(document.getElementById('ex_max').value) || 100, passing_marks: parseFloat(document.getElementById('ex_pass').value) || 33, display_order: parseInt(document.getElementById('ex_order').value) || 0, start_date: document.getElementById('ex_start').value ? new Date(document.getElementById('ex_start').value).toISOString() : null, end_date: document.getElementById('ex_end').value ? new Date(document.getElementById('ex_end').value).toISOString() : null, classroom_ids: clsIds };
        if (editingExamId) {
          await ExamAPI.update(editingExamId, payload);
          showToast('Exam updated!');
        } else {
          await ExamAPI.create(payload);
          showToast('Exam created!');
        }
        document.getElementById('examModal').style.display = 'none'; loadExams();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function setupDefaultExams() {
      if (!schoolId || !ayId) { showToast('Configure school and academic year', 'error'); return; }
      try {
        const r = await ExamAPI.seedDefaults(schoolId, ayId);
        showToast(`Default exam setup saved (${r.data.created || 0} new)`);
        loadExams();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function loadExams() {
      if (!schoolId) { document.getElementById('examTable').innerHTML = '<div class="text-center py-8 text-gray-400">Configure school first</div>'; return; }
      const params = { school_id: schoolId }; if (ayId) params.academic_year_id = ayId;
      const type = document.getElementById('examTypeFilter').value; if (type) params.exam_type = type;
      try {
        const r = await ExamAPI.list(params); const exams = r?.data || [];
        examList = exams;
        const hdrs = ['Exam', 'Type', 'Max', 'Min', 'Order', 'Classes', 'Status', 'Actions'];
        const rows = exams.map(e => `
      <td class="px-4 py-3 font-medium text-gray-900 text-sm">${e.name}</td>
      <td class="px-4 py-3">${tdBadge(e.exam_type, 'blue')}</td>
      <td class="px-4 py-3 text-sm text-gray-700">${e.max_marks || 0}</td>
      <td class="px-4 py-3 text-sm text-gray-700">${e.passing_marks || 0}</td>
      <td class="px-4 py-3 text-sm text-gray-700">${e.display_order || '-'}</td>
      <td class="px-4 py-3 text-xs text-gray-500">${(e.classes || []).join(', ') || '-'}</td>
      <td class="px-4 py-3">${tdBadge(e.status, e.status === 'Results Published' ? 'green' : e.status === 'Completed' ? 'blue' : e.status === 'Ongoing' ? 'orange' : 'gray')}</td>
      <td class="px-4 py-3 relative">
        <button onclick="toggleExamActionMenu('${e.id}')" class="px-3 py-2 rounded-lg border border-gray-200 bg-gray-50 text-xs font-semibold text-slate-700 hover:bg-gray-100">Action</button>
        <div id="examAction_${e.id}" class="hidden absolute right-4 z-20 mt-2 w-44 rounded-xl border border-gray-200 bg-white shadow-xl overflow-hidden">
          <button onclick="openExamModal('${e.id}')" class="block w-full px-4 py-2.5 text-left text-sm text-slate-700 hover:bg-slate-50">Edit</button>
          <button onclick="deleteExam('${e.id}')" class="block w-full px-4 py-2.5 text-left text-sm text-red-600 hover:bg-red-50">Delete</button>
          <div class="border-t border-gray-100 px-3 py-2">
            <label class="block text-[11px] font-semibold uppercase tracking-wide text-slate-400 mb-1">Status</label>
            <select onchange="updateExamStatus('${e.id}',this.value)" class="w-full text-xs px-2 py-1.5 rounded-lg border border-gray-200 bg-gray-50">
              <option value="">Change Status</option>
              <option value="Scheduled">Scheduled</option><option value="Ongoing">Ongoing</option><option value="Completed">Completed</option><option value="Results Published">Publish Results</option>
            </select>
          </div>
        </div>
      </td>
    `);
        document.getElementById('examTable').innerHTML = buildTable(hdrs, rows, 'No exams found. Create your first exam!');
      } catch (e) { document.getElementById('examTable').innerHTML = `<div class="text-center py-8 text-red-400">Error: ${e.message}</div>`; }
    }

    function toggleExamActionMenu(id) {
      document.querySelectorAll('[id^="examAction_"]').forEach(menu => {
        if (menu.id !== `examAction_${id}`) menu.classList.add('hidden');
      });
      document.getElementById(`examAction_${id}`)?.classList.toggle('hidden');
    }

    async function updateExamStatus(id, status) {
      if (!status) return;
      try { await ExamAPI.updateStatus(id, status); showToast('Status updated to ' + status); loadExams(); } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function deleteExam(id) {
      if (!confirm('Delete this exam?')) return;
      try {
        await ExamAPI.delete(id);
        showToast('Exam deleted');
        loadExams();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function loadRollFormData() {
      if (!schoolId) return;
      try {
        const r = await ClassAPI.list(schoolId, ayId);
        examClasses = r?.data || [];
        document.getElementById('rn_cls').innerHTML = '<option value="">Select class</option>' + examClasses.map(c => `<option value="${c.id}" data-secs='${JSON.stringify(c.sections)}'>${c.name}</option>`).join('');
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    function loadRollSections() {
      const opt = document.getElementById('rn_cls').selectedOptions[0];
      document.getElementById('rn_sec').innerHTML = '<option value="">All sections</option>' + (opt?.dataset.secs ? JSON.parse(opt.dataset.secs).map(s => `<option value="${s.id}">${s.name}</option>`).join('') : '');
    }

    function toggleRollSeries() {

    function getRbseDivision(result) {
      if (!result || result.is_pass === false || String(result.result_status || '').toLowerCase() === 'fail') return 'Fail';
      const percentage = parseFloat(result.percentage) || 0;
      if (percentage >= 60) return 'First Division';
      if (percentage >= 45) return 'Second Division';
      if (percentage >= 33) return 'Third Division';
      return 'Fail';
    }

            <thead><tr><th>Subject</th><th>Marks</th><th>Grade</th><th>Status</th></tr></thead>
            <tbody>
              ${(result.subjects || []).map(subject => `<tr><td>${subject.name || '-'}</td><td>${subject.obtained || 0}/${subject.max || 0}</td><td>${subject.grade || '-'}</td><td>${subject.is_pass ? 'Pass' : 'Fail'}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>`).join('')}
      </body></html>`;
    }

    function openPrintWindow(html) {
      const printWindow = window.open('', '_blank', 'width=1100,height=800');
      if (!printWindow) { showToast('Allow popups to print results', 'error'); return; }
      printWindow.document.open();
      printWindow.document.write(html);
      printWindow.document.close();
      setTimeout(() => { printWindow.focus(); printWindow.print(); }, 300);
    }

    function printSingleResult(resultId) {
      const result = latestResults.find(item => item.id === resultId);
      if (!result) { showToast('Load results first', 'error'); return; }
      openPrintWindow(buildResultPrintHtml([result], `${result.student_name || 'Student'} Result Card`));
    }

    function printResultsSummary() {
      if (!latestResults.length) { showToast('Load results before printing', 'error'); return; }
      openPrintWindow(buildResultPrintHtml(latestResults, 'Exam Result Summary'));
    }

    async function loadResultFormData() {
      if (!schoolId) return;
      try {
        const [er, cr] = await Promise.allSettled([ExamAPI.list({ school_id: schoolId, academic_year_id: ayId || '' }), ClassAPI.list(schoolId, ayId)]);
        if (er.status === 'fulfilled') document.getElementById('res_exam').innerHTML = '<option value="">Select exam</option>' + (er.value?.data || []).map(e => `<option value="${e.id}">${e.name} (${e.max_marks || 100})</option>`).join('');
        if (cr.status === 'fulfilled') { const cls = cr.value?.data || []; document.getElementById('res_cls').innerHTML = '<option value="">Select class</option>' + cls.map(c => `<option value="${c.id}" data-secs='${JSON.stringify(c.sections)}'>${c.name}</option>`).join(''); }
      } catch (e) { }
    }

    document.getElementById('examTypeFilter').addEventListener('change', loadExams);
    loadExams();
  </script>
</body>

</html>
